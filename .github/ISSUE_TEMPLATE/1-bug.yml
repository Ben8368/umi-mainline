name: Bug report
description: Report a reproducible umi-mainline failure.
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Device and environment
      description: Device/panel/touch variant, kernel commit, host OS/architecture and image hash. Never upload private partition dumps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Expected/actual behavior, commands and sanitized logs; distinguish static, simulated, compiled and device-tested evidence.
    validations:
      required: true

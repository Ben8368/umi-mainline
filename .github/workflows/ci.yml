name: CI
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: |
          python3 scripts/governance-docs-check.py
          python3 tests/governance-docs.py
          python3 scripts/git-hooks-test.py
          python3 tests/ci-policy.py
          python3 tests/bot-dispatch.py
      - name: Check attribution of new commits
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-commit-attribution.py
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3-yaml
      - run: python3 scripts/check-tree.py
  offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  result:
    name: CI result
    if: always()
    needs: [governance, lint, offline]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fail closed on missing or unsuccessful jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-result.py
